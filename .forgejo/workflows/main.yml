name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: developer-portal-ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          test "${actual}" = "${expected}"

      - name: Configure BuildBuddy remote settings
        run: ./scripts/write_buildbuddy_bazelrc.sh --require-key

      - name: Bazel build
        run: bazel build --config=remote --verbose_failures //:compile //:release_tar //docker:developer_portal_image

      - name: Bazel test
        run: bazel test --config=remote --verbose_failures //:mix_test

      - name: OpenSpec validation
        run: openspec validate add-developer-portal --strict
