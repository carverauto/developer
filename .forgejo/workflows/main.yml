name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: developer-portal-ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Bazel artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev git curl

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          test "${actual}" = "${expected}"

      - name: Configure BuildBuddy remote settings
        run: ./scripts/write_buildbuddy_bazelrc.sh --require-key

      - name: Bazel build
        run: bazel build --config=remote --verbose_failures //:compile //:release_tar //docker:developer_portal_image

      - name: Bazel test
        run: bazel test --config=remote --verbose_failures //:mix_test

      - name: OpenSpec validation
        run: openspec validate add-developer-portal --strict
