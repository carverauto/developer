name: Publish Image

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'build/**'
      - 'config/**'
      - 'docker/**'
      - 'lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
      - '.bazelversion'
      - 'buildbuddy.yaml'
      - 'rel/**'
      - 'priv/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: developer-portal-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Bazel artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.BAZELISK_HOME }}
            third_party/bazel-repo-cache
            third_party/bazel-disk-cache
            third_party/distdir
          key: ${{ runner.os }}-bazel-publish-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            ${{ runner.os }}-bazel-publish-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev git curl

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.19.4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          test "${actual}" = "${expected}"

      - name: Configure BuildBuddy remote settings
        run: ./scripts/write_buildbuddy_bazelrc.sh --require-key

      - name: Configure registry auth for rules_oci
        run: ./buildbuddy_setup_docker_auth.sh

      - name: Bazel test
        run: bazel test --config=remote --verbose_failures //:mix_test

      - name: Build and publish image
        run: bazel run --config=remote_push --verbose_failures //docker:developer_portal_image_push
