name: Publish Image

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'build/**'
      - 'config/**'
      - 'docker/**'
      - 'lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'MODULE.bazel'
      - 'BUILD.bazel'
      - '.bazelrc'
      - '.bazelversion'
      - 'buildbuddy.yaml'
      - 'rel/**'
      - 'priv/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: developer-portal-publish-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      OCI_REGISTRY: registry.carverauto.dev
      OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
      OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      BAZELISK_HOME: ${{ github.workspace }}/.cache/bazelisk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bazelisk
        run: ./scripts/install-bazelisk.sh

      - name: Verify Bazel version
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < .bazelversion)"
          actual="$(bazel --version | awk '{print $NF}')"
          test "${actual}" = "${expected}"

      - name: Configure BuildBuddy remote settings
        run: ./scripts/write_buildbuddy_bazelrc.sh --require-key

      - name: Verify publish credentials
        run: |
          set -euo pipefail
          if [[ -z "${OCI_USERNAME:-}" || -z "${OCI_TOKEN:-}" ]]; then
            echo "OCI_USERNAME and OCI_TOKEN secrets must be configured for image publishing." >&2
            exit 1
          fi

      - name: Configure registry auth for rules_oci
        run: ./buildbuddy_setup_docker_auth.sh

      - name: Bazel test
        run: bazel test --config=remote --verbose_failures //:mix_test

      - name: Build and publish image
        run: bazel run --config=remote_push --verbose_failures //docker:developer_portal_image_push
