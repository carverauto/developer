apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: developer-portal-edge
  namespace: serviceradar-developer
spec:
  ipFamily: DualStack
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          # Includes the GHSA-3wvj-j6qm-62mr Brotli fix.
          image: docker.io/envoyproxy/envoy:distroless-v1.37.10@sha256:1a7419aa065833fd08cf2976d7a01063e0e1a84b220436ebc16c1d827b7c98fd
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: envoy
                      livenessProbe:
                        timeoutSeconds: 5
                      readinessProbe:
                        failureThreshold: 3
                        timeoutSeconds: 5
                      startupProbe:
                        timeoutSeconds: 5
                    - name: shutdown-manager
                      livenessProbe:
                        timeoutSeconds: 5
                      readinessProbe:
                        timeoutSeconds: 5
                      startupProbe:
                        timeoutSeconds: 5
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Local
        annotations:
          metallb.universe.tf/address-pool: k3s-pool
        patch:
          type: StrategicMerge
          value:
            spec:
              ipFamilies:
                - IPv4
                - IPv6
              ipFamilyPolicy: PreferDualStack
