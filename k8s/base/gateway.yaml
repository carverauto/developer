apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: developer-portal-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: developer-portal-edge
    namespace: serviceradar-developer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: developer-portal-gateway
  namespace: serviceradar-developer
spec:
  gatewayClassName: developer-portal-envoy
  listeners:
    - name: https
      hostname: developer.example.invalid
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - kind: Secret
            name: developer-portal-tls
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Same
