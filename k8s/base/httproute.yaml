apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: developer-portal
  namespace: serviceradar-developer
  annotations:
    external-dns.alpha.kubernetes.io/hostname: developer.example.invalid
spec:
  parentRefs:
    - name: developer-portal-gateway
      namespace: serviceradar-developer
      sectionName: https
  hostnames:
    - developer.example.invalid
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: developer-portal
          port: 80
