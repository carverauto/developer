apiVersion: batch/v1
kind: Job
metadata:
  name: developer-portal-migrate
  namespace: serviceradar-developer
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: developer-portal
        job: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.carverauto.dev/serviceradar/developer-portal:latest
          imagePullPolicy: Always
          command: ["/app/bin/migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: developer-portal-config
          env:
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: developer-portal-secrets
                  key: secret_key_base
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: developer-portal-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: developer-portal-db-credentials
                  key: password
            - name: AUTHENTIK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: developer-portal-secrets
                  key: authentik_client_id
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: developer-portal-secrets
                  key: authentik_client_secret
            - name: ECTO_IPV6
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
