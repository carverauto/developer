apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: developer-portal-pg
  namespace: serviceradar-developer
spec:
  # Single instance until the old replica image is recovered; HA can be re-enabled
  # after both nodes can pull a registry-resident CNPG image.
  instances: 1

  # Previous tag 18.3.0-sr2-a78b3afd was GC'd from Harbor (404), which left the
  # second instance in ImagePullBackOff and blocked Argo sync waves indefinitely.
  imageName: registry.carverauto.dev/serviceradar/serviceradar-cnpg:18.3.0-sr5@sha256:c349a1d34aef056f818630e0766501b5c98fa7598bdeee38d59d677a94cb18c9

  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: "100"
      password_encryption: scram-sha-256

  storage:
    size: 20Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: developer_portal
      owner: developer_portal
      secret:
        name: developer-portal-db-credentials

  managed:
    roles:
      - name: developer_portal
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false

  monitoring:
    enablePodMonitor: true
