apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: developer-portal-pg
  namespace: serviceradar-developer
spec:
  instances: 2

  # Pin by digest. The previous 18.3.0-sr5@sha256:c349a1d3... digest was
  # garbage-collected from Harbor, leaving replicas in ImagePullBackOff
  # (serviceradar-control#34). 18.4.0-sr4 is the digest the control-plane and
  # demo clusters run; this DB only uses plpgsql, so the PG 18.3 -> 18.4 minor
  # bump needs no extension changes.
  imageName: registry.carverauto.dev/serviceradar/serviceradar-cnpg:18.4.0-sr4@sha256:59e442dec59fac3149e3a3c49ba0cc2987bfb052bca1a0ea8c01b4bb31427d1d

  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: "100"
      password_encryption: scram-sha-256

  storage:
    size: 20Gi
    storageClass: local-path

  bootstrap:
    initdb:
      database: developer_portal
      owner: developer_portal
      secret:
        name: developer-portal-db-credentials

  managed:
    roles:
      - name: developer_portal
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false

  monitoring:
    enablePodMonitor: true
