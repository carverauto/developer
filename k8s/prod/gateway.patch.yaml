apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: developer-portal-gateway
  namespace: serviceradar-developer
spec:
  listeners:
    - name: https
      hostname: developer.serviceradar.cloud
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - kind: Secret
            name: developer-portal-tls
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: Same
