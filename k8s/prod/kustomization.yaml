apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secrets.yaml
  - ../base

patches:
  - path: configmap.patch.yaml
  - path: certificate.patch.yaml
  - path: gateway.patch.yaml
  - path: httproute.patch.yaml
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: developer-portal-edge
      namespace: serviceradar-developer
    patch: |-
      - op: add
        path: /spec/provider/kubernetes/envoyService/annotations/metallb.io~1loadBalancerIPs
        value: 23.138.124.11,2602:f678:0:105::2

replicas:
  - name: developer-portal
    count: 2

images:
  - name: registry.carverauto.dev/serviceradar/developer-portal
    newTag: sha-54cfc079c286
