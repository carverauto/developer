apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - ../base

patches:
  - path: configmap.patch.yaml
  - path: certificate.patch.yaml
  - path: gateway.patch.yaml
  - path: httproute.patch.yaml
  - target:
      version: v1
      kind: ConfigMap
      name: developer-portal-config
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      version: v1
      kind: Service
      name: developer-portal
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: developer-portal
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: batch
      version: v1
      kind: Job
      name: developer-portal-migrate
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: developer-portal-tls
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: gateway.envoyproxy.io
      version: v1alpha1
      kind: EnvoyProxy
      name: developer-portal-edge
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: developer-portal-gateway
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: developer-portal
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-default-deny
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-allow-dns
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-app-ingress
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-app-egress-db
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-app-egress-https
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: developer-portal-db-ingress-app
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: developer-portal-pg
      namespace: serviceradar-developer
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: serviceradar-developer-staging

images:
  - name: registry.carverauto.dev/serviceradar/developer-portal
    newTag: staging
